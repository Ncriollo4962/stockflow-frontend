    <path d="M880 980 H1820 V560 H880 Z" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="10" />
    <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="12" stroke-linecap="round">
      <path d="M930 620 H1780"/>
      <path d="M930 720 H1780"/>
      <path d="M930 820 H1780"/>
      <path d="M930 920 H1780"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="10" stroke-linecap="round">
      <path d="M1040 560 V980"/>
      <path d="M1280 560 V980"/>
      <path d="M1520 560 V980"/>
      <path d="M1760 560 V980"/>
