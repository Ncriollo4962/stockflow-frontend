      <rect x="1120" y="640" width="140" height="70" rx="10" fill="url(#metalFill)"/>
      <rect x="1320" y="640" width="110" height="70" rx="10" fill="url(#metalFill)"/>
      <rect x="1500" y="640" width="150" height="70" rx="10" fill="url(#metalFill)"/>
      <rect x="1680" y="640" width="110" height="70" rx="10" fill="url(#metalFill)"/>
      <rect x="980" y="740" width="150" height="70" rx="10" fill="url(#metalFill)"/>
      <rect x="1160" y="740" width="120" height="70" rx="10" fill="url(#metalFill)"/>
      <rect x="1330" y="740" width="160" height="70" rx="10" fill="url(#metalFill)"/>
      <rect x="1520" y="740" width="130" height="70" rx="10" fill="url(#metalFill)"/>
      <rect x="1690" y="740" width="90" height="70" rx="10" fill="url(#metalFill)"/>
    </g>
  </g>

  <g opacity="0.24" stroke="url(#steel)" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(1480 220) rotate(18)">
      <path d="M112 26c12 8 19 22 19 40 0 28-23 51-51 51-6 0-12-1-18-3L36 140l-22-22 31-31c-2-6-3-12-3-18 0-28 23-51 51-51 18 0 32 8 40 19l-19 19c-5-6-12-9-20-9-13 0-24 11-24 24 0 9 4 16 10 21l66-66z"/>
      <path d="M36 140l-25 78 36 36 78-25"/>
    </g>
    <g transform="translate(240 170) rotate(-14)">
      <path d="M46 30h80l48 48v38l-25 25H70L46 116z"/>
      <path d="M102 30v50"/>
      <path d="M170 142l42 42"/>
      <path d="M186 126l28 28"/>
    </g>
  </g>

  <g filter="url(#softGlow)">
