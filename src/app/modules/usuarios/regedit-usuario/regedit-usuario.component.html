<div class="card p-2 m-0 shadow-lg bg-bg-card transition-colors duration-300">
  <div class="flex-none flex flex-col gap-1 mb-4 px-4 pt-4">
    <div class="flex items-center gap-2 text-primary">
      <i class="pi text-xl" [ngClass]="isEditMode ? 'pi-user-edit' : 'pi-user-plus'"></i>
      <span class="text-xl font-semibold">{{ isEditMode ? 'Editar Usuario' : 'Nuevo Usuario' }}</span>
    </div>
    <span class="text-surface-500 dark:text-surface-400 text-sm">
      {{ isEditMode ? 'Modifica la información del usuario' : 'Registra un nuevo usuario en el sistema' }}
    </span>
  </div>

  <form [formGroup]="form" class="grid grid-cols-1 px-6">
    <p-fieldset legend="Información General">
      <div class="card grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 px-6 py-4">

        <div class="flex flex-col gap-2">
          <label for="codigo" class="font-semibold text-text-main">Código de Usuario</label>
          <input pInputText id="codigo" formControlName="codigo"
                 placeholder="Ej: USR001" class="w-full h-11 input-custom-border" />
        </div>

        <div class="flex flex-col gap-2">
          <label for="nombre" class="font-semibold text-text-main">Nombre Completo</label>
          <input pInputText id="nombre" formControlName="nombre"
                 placeholder="Nombre del usuario" class="w-full h-11 input-custom-border" />
        </div>

        <div class="flex flex-col gap-2">
          <label for="email" class="font-semibold text-text-main">Correo Electrónico</label>
          <input pInputText id="email" formControlName="email"
                 placeholder="usuario@ejemplo.com" class="w-full h-11 input-custom-border" />
        </div>

        <div class="flex flex-col gap-2">
          <label for="contrasena" class="font-semibold text-text-main">Contraseña</label>
          <p-password id="contrasena" formControlName="contrasena"
                      [toggleMask]="true" [feedback]="!isEditMode"
                      placeholder="********" styleClass="w-full"
                      inputStyleClass="w-full h-11 input-custom-border"></p-password>
        </div>

        <div class="flex flex-col gap-2">
          <label for="rol" class="font-semibold text-text-main">Roles Asignados</label>
           <p-select #rol formControlName="rol"
                    [options]="rolesList" placeholder="Seleccione un rol"
                    [fluid]="true" styleClass="h-11 flex items-center input-custom-border"></p-select>
        </div>

        <div class="flex flex-col gap-2">
          <label for="estado" class="font-semibold text-text-main">Estado</label>
          <div class="flex items-center gap-2 h-11">
            <p-toggleswitch id="estado" formControlName="estado"></p-toggleswitch>
            <span [class]="form.get('estado')?.value ? 'text-green-500' : 'text-red-500'">
              {{ form.get('estado')?.value ? 'Activo' : 'Inactivo' }}
            </span>
          </div>
        </div>

      </div>
    </p-fieldset>

    <div class="flex justify-end gap-2 mt-3">
      <p-button label="Cancelar" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="cancelar()"></p-button>
      <p-button [disabled]="btnSaveDisabled" [label]="isEditMode ? 'Actualizar Usuario' : 'Guardar Usuario'"
                icon="pi pi-check" severity="primary" (onClick)="guardarUsuario()"></p-button>
    </div>
  </form>
</div>
