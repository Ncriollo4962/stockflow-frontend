<div class="text-text-main h-full transition-colors duration-300">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-bg-card p-2  shadow-sm transition-colors duration-300">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span class="text-text-main font-medium block mb-1">Total Productos</span>
                    <div class="text-2xl font-bold text-text-body">1,240</div>
                </div>
                <div class="p-2 rounded">
                    <i class="pi pi-box text-blue-500 text-xl"></i>
                </div>
            </div>
            <div class="text-sm">
                <span class="text-green-500 font-semibold">24 nuevos</span>
                <span class="text-text-main ml-2">esta semana</span>
            </div>
        </div>

        <div class="bg-bg-card p-2  shadow-sm transition-colors duration-300">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span class="text-text-main font-medium block mb-1">Stock Crítico</span>
                    <div class="text-2xl font-bold text-orange-500">12 Artículos</div>
                </div>
                <div class="p-2 rounded">
                    <i class="pi pi-exclamation-triangle text-orange-500 text-xl"></i>
                </div>
            </div>
            <div class="text-sm text-red-500 font-medium italic">Revisión urgente requerida</div>
        </div>

        <div class="bg-bg-card p-2  shadow-sm transition-colors duration-300">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span class="text-text-main font-medium block mb-1">Órdenes de Ventas del Mes</span>
                    <div class="text-2xl font-bold text-text-body">S/ 14,500</div>
                </div>
                <div class="p-2 rounded">
                    <i class="pi pi-shopping-cart text-cyan-500 text-xl"></i>
                </div>
            </div>
            <div class="text-sm text-text-main">
                <span class="text-green-500">10% ↑</span> vs mes anterior
            </div>
        </div>

        <div class="bg-bg-card p-2  shadow-sm transition-colors duration-300">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span class="text-text-main font-medium block mb-1">Órdenes de Compra Pendientes por Recepción</span>
                    <div class="text-2xl font-bold text-text-body">5 Órdenes</div>
                </div>
                <div class="p-2 rounded">
                    <i class="pi pi-clock text-purple-500 text-xl"></i>
                </div>
            </div>
            <div class="text-sm text-text-main italic">Esperando ingreso (CUS11)</div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex-1 flex flex-col gap-4">
        <div class="bg-bg-card p-2  shadow-sm transition-colors duration-300">
          <div class="card  h-[10rem] md:h-[12rem] lg:h-[14rem] xl:h-[16rem] 2xl:h-[18rem] 3xl:h-[20rem] 4xl:h-[25rem]">
             <p-chart type="line" [data]="chartDataEvolucionComprasVentas" [options]="lineOptions()"
             width="100%" height="100%"/>
          </div>
        </div>
        <div class="bg-bg-card p-2 rounded-lg shadow-sm transition-colors duration-300">
         <div class="card  h-[10rem] md:h-[12rem] lg:h-[14rem] xl:h-[16rem] 2xl:h-[18rem] 3xl:h-[20rem] 4xl:h-[25rem]">
            <p-chart
              type="doughnut"
              [data]="chartDataValorizacionInventarioPorCateg"
              [options]="doughnutOptions()"
              width="100%" height="100%"/>
          </div>
        </div>
      </div>
      <div class="flex-1 flex flex-col gap-4">
        <div class="bg-bg-card p-2 rounded-lg shadow-sm transition-colors duration-300">
        <div class="card  h-[10rem] md:h-[12rem] lg:h-[14rem] xl:h-[16rem] 2xl:h-[18rem] 3xl:h-[20rem] 4xl:h-[25rem]">
            <p-chart
              type="bar"
              [data]="chartDataMovimientosInventario"
              [options]="barVerticalOptions()"
              width="100%" height="100%"/>
          </div>
        </div>
        <div class="bg-bg-card p-2 rounded-lg shadow-sm transition-colors duration-300">
         <div class="card  h-[10rem] md:h-[12rem] lg:h-[14rem] xl:h-[16rem] 2xl:h-[18rem] 3xl:h-[20rem] 4xl:h-[25rem]">
            <p-chart
              type="bar"
              [data]="chartDataTop10Productos"
              [options]="barHorizontalOptions()"
              width="100%" height="100%"/>
          </div>
        </div>
      </div>
    </div>
</div>
