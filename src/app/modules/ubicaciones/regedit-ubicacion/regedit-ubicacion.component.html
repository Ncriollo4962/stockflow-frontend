<div class="card p-2 m-0 shadow-lg bg-bg-card transition-colors duration-300">
  <div class="flex-none flex flex-col gap-1 mb-4 px-4 pt-4">
    <div class="flex items-center gap-2 text-primary">
      <i class="pi pi-map-marker text-xl"></i>
      <span class="text-xl font-semibold">
        {{ isEditMode ? 'Editar Ubicación' : 'Nueva Ubicación' }}
      </span>
    </div>
    <span class="text-surface-500 dark:text-surface-400 text-sm">
      {{ isEditMode ? 'Modifica la información de la ubicación' : 'Registra una nueva ubicación' }}
    </span>
  </div>

  <form [formGroup]="form" class="grid grid-cols-1 px-6">
    <p-fieldset legend="Información General">
      <div class="card grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 px-6 py-4">
        <div class="flex flex-col gap-2">
          <label for="codigo" class="font-semibold text-text-main">Código</label>
          <input
            pInputText
            id="codigo"
            formControlName="codigo"
            placeholder="Ej: UB001"
            class="w-full h-11 input-custom-border"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="nombre" class="font-semibold text-text-main">Nombre</label>
          <input
            pInputText
            id="nombre"
            formControlName="nombre"
            placeholder="Nombre de la ubicación"
            class="w-full h-11 input-custom-border"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="estado" class="font-semibold text-text-main">Estado</label>
          <div class="flex items-center gap-2 h-11">
            <p-toggleswitch id="estado" formControlName="estado"></p-toggleswitch>
            <span [class]="form.get('estado')?.value ? 'text-green-500' : 'text-red-500'">
              {{ form.get('estado')?.value ? 'Activo' : 'Inactivo' }}
            </span>
          </div>
        </div>

        <div class="flex flex-col gap-2 md:col-span-2 lg:col-span-3">
          <label for="descripcion" class="font-semibold text-text-main">Descripción</label>
          <textarea
            pTextarea
            id="descripcion"
            formControlName="descripcion"
            rows="3"
            [autoResize]="false"
            class="w-full input-custom-border"
          ></textarea>
        </div>
      </div>
    </p-fieldset>

    <div class="flex justify-end gap-2 mt-3">
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        (onClick)="cancelar()"
      ></p-button>
      <p-button
        [disabled]="btnSaveDisabled"
        [label]="isEditMode ? 'Actualizar Ubicación' : 'Guardar Ubicación'"
        icon="pi pi-check"
        severity="primary"
        (onClick)="guardarUbicacion()"
      ></p-button>
    </div>
  </form>
</div>
