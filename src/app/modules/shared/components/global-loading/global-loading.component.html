<div
  *ngIf="loading()"
  class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/20 backdrop-blur-[2px]"
>
  <div
    class="flex items-center gap-3 rounded-xl bg-bg-card px-4 py-3 shadow-lg ring-1 ring-black/5 dark:ring-white/10"
  >
    <p-progressSpinner
      strokeWidth="4"
      styleClass="w-7 h-7"
      ariaLabel="Cargando"
    />
    <div class="flex flex-col leading-tight">
      <span class="text-sm font-semibold text-text-main">Cargando...</span>
      <span class="text-xs text-surface-500 dark:text-surface-400">
        Espere un momento
      </span>
    </div>
  </div>
</div>
