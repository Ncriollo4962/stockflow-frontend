<!-- Static Sidebar -->
<div
  *ngIf="menuMode === 'static'"
  class="w-[280px] shrink-0  bg-surface-0 dark:bg-surface-900 h-screen sticky top-0 overflow-y-auto hidden lg:block"
>
  <app-menu></app-menu>
</div>

<!-- Overlay Sidebar -->
<p-drawer [visible]="visible" (visibleChange)="visibleChange.emit($event)" [modal]="true">
  <ng-template #headless>
    <app-menu [isOverlay]="true" (shouldClose)="visibleChange.emit(false)"></app-menu>
  </ng-template>
</p-drawer>
