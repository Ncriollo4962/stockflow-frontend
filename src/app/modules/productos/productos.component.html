<div class="card p-2 m-0 shadow-lg bg-bg-card transition-colors duration-300">
  <div class="flex-none flex flex-col gap-1 mb-4 px-4 pt-4">
    <div class="flex items-center gap-2 text-primary">
      <i class="pi pi-box text-xl"></i>
      <span class="text-xl font-semibold">Gestión de Productos</span>
    </div>
    <span class="text-surface-500 dark:text-surface-400 text-sm">
      Administración de productos
    </span>
  </div>

  <p-confirmDialog />

  <app-data-table
    #dataTable
    [data]="productos"
    [cols]="cols"
    [globalFilterFields]="['codigo', 'nombre', 'descripcion', 'categoria.nombre']"
    [(selection)]="selectedProductos"
    (shouldonCreate)="openNew()"
    (shouldonEdit)="editProducto($event)"
    (shouldonDelete)="deleteProducto($event)"
    (shouldonDeleteSelected)="deleteSelectedProductos($event)"
  ></app-data-table>
</div>
