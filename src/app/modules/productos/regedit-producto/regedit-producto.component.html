<div class="card p-2 m-0 shadow-lg bg-bg-card transition-colors duration-300">
  <div class="flex-none flex flex-col gap-1 mb-4 px-4 pt-4">
    <div class="flex items-center gap-2 text-primary">
      <i class="pi pi-box text-xl"></i>
      <span class="text-xl font-semibold">
        {{ isEditMode ? 'Editar Producto' : 'Nuevo Producto' }}
      </span>
    </div>
    <span class="text-surface-500 dark:text-surface-400 text-sm">
      {{ isEditMode ? 'Modifica la información del producto' : 'Registra un nuevo producto' }}
    </span>
  </div>

  <form [formGroup]="form" class="grid grid-cols-1 px-6">
    <p-fieldset legend="Información General">
      <div class="card grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 px-6 py-4">
        <div class="flex flex-col gap-2">
          <label for="codigo" class="font-semibold text-text-main">Código</label>
          <input
            pInputText
            id="codigo"
            formControlName="codigo"
            placeholder="Ej: PRD001"
            class="w-full h-11 input-custom-border"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="nombre" class="font-semibold text-text-main">Nombre</label>
          <input
            pInputText
            id="nombre"
            formControlName="nombre"
            placeholder="Nombre del producto"
            class="w-full h-11 input-custom-border"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label for="categoriaId" class="font-semibold text-text-main">Categoría</label>
          <p-select
            #categoriaId
            formControlName="categoriaId"
            [options]="categoriasList"
            optionLabel="nombre"
            optionValue="id"
            placeholder="Seleccione una categoría"
            [filter]="true"
            filterBy="nombre"
            [fluid]="true"
            styleClass="h-11 flex items-center input-custom-border"
          ></p-select>
        </div>

        <div class="flex flex-col gap-2">
          <label for="precioCosto" class="font-semibold text-text-main">Precio Costo</label>
          <p-inputnumber
            #precioCosto
            formControlName="precioCosto"
            mode="currency"
            currency="PEN"
            locale="es-PE"
            [fluid]="true"
            inputStyleClass="h-11 input-custom-border"
          ></p-inputnumber>
        </div>

        <div class="flex flex-col gap-2">
          <label for="precioVenta" class="font-semibold text-text-main">Precio Venta</label>
          <p-inputnumber
            #precioVenta
            formControlName="precioVenta"
            mode="currency"
            currency="PEN"
            locale="es-PE"
            [fluid]="true"
            inputStyleClass="h-11 input-custom-border"
          ></p-inputnumber>
        </div>

        <div class="flex flex-col gap-2">
          <label for="cantidadMinima" class="font-semibold text-text-main">Cantidad Mínima</label>
          <p-inputnumber
            #cantidadMinima
            formControlName="cantidadMinima"
            [showButtons]="true"
            buttonLayout="horizontal"
            spinnerMode="horizontal"
            decrementButtonClass="p-button-secondary"
            incrementButtonClass="p-button-secondary"
            [fluid]="true"
            inputStyleClass="h-11 input-custom-border"
          ></p-inputnumber>
        </div>

        <div class="flex flex-col gap-2">
          <label for="estado" class="font-semibold text-text-main">Estado</label>
          <div class="flex items-center gap-2 h-11">
            <p-toggleswitch id="estado" formControlName="estado"></p-toggleswitch>
            <span [class]="form.get('estado')?.value ? 'text-green-500' : 'text-red-500'">
              {{ form.get('estado')?.value ? 'Activo' : 'Inactivo' }}
            </span>
          </div>
        </div>

        <div class="flex flex-col gap-2 md:col-span-2 lg:col-span-3">
          <label for="descripcion" class="font-semibold text-text-main">Descripción</label>
          <textarea
            pTextarea
            id="descripcion"
            formControlName="descripcion"
            rows="3"
            [autoResize]="false"
            class="w-full input-custom-border"
          ></textarea>
        </div>
      </div>
    </p-fieldset>

    <div class="flex justify-end gap-2 mt-3">
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        (onClick)="cancelar()"
      ></p-button>
      <p-button
        [disabled]="btnSaveDisabled"
        [label]="isEditMode ? 'Actualizar Producto' : 'Guardar Producto'"
        icon="pi pi-check"
        severity="primary"
        (onClick)="guardarProducto()"
      ></p-button>
    </div>
  </form>
</div>
