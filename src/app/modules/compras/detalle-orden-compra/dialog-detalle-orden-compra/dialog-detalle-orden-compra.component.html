<p-dialog [(visible)]="productDialog"  header="Nuevo detalle de orden de compra" [modal]="true">
  <ng-template #content>
      <div class="card shadow-sm p-2 tex">
        <form [formGroup]="detalleForm" class="grid grid-cols-1 p-1">
          <div class="card grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-2 p-1">
            <div class="flex flex-col gap-2">
              <label for="productoSelect" class="text-sm font-bold text-text-main">Producto</label>
              <p-select
                #productoSelect
                formControlName="producto"
                [options]="products"
                optionLabel="nombre"
                [filter]="false"
                filterBy="nombre"
                appendTo="body"
                scrollHeight="150px"
                placeholder="Seleccionar item"
                class="w-full md:w-56"
                (onChange)="onProductoSelect($event.value)">
              </p-select>
            </div>

            <div class="flex flex-col gap-2">
                <label for="cantidadInput" class="text-sm font-bold text-text-main">Cantidad</label>
                <p-inputnumber
                  #cantidadInput
                  formControlName="cantidad"
                  [showButtons]="true"
                  buttonLayout="horizontal"
                  spinnerMode="horizontal"
                  decrementButtonClass="p-button-secondary"
                  incrementButtonClass="p-button-secondary"
                  incrementButtonIcon="pi pi-plus"
                  decrementButtonIcon="pi pi-minus"
                  [min]="1"
                  class="w-full">
                </p-inputnumber>
              </div>

            <div class="flex flex-col gap-2">
              <label for="precioUnitarioInput" class="text-sm font-bold text-text-main">Precio Unitario</label>
              <p-inputnumber
                #precioUnitarioInput
                formControlName="precioUnitario"
                mode="currency"
                currency="PEN"
                locale="es-PE"
                class="w-full">
              </p-inputnumber>
            </div>

              <div class="flex flex-col gap-2">
                <label for="subtotalInput" class="text-sm font-bold text-text-main">Subtotal</label>
                <div class="p-inputtext bg-white font-bold text-right text-black">
                  {{ detalleForm.get('subtotal')?.value | currency:'PEN':'S/ ' }}
                </div>
              </div>
          </div>
        </form>
        <small *ngIf="detalleForm.get('cantidad')?.errors?.['min']" class="text-red-500 block mt-2">
        * La cantidad mínima es 1
        </small>
      </div>
  </ng-template>
  <ng-template #footer>
      <p-button label="Cancel" icon="pi pi-times" text (onClick)="hideDialog()" />
      <p-button  [disabled]="detalleForm.invalid"
          label="Añadir" icon="pi pi-cart-plus"(onClick)="agregarDetalle()" />
  </ng-template>
</p-dialog>
