<p-confirmDialog />
<app-data-table
    #dataTable
    [data]="ordenesCompra"
    [cols]="cols"
    [globalFilterFields]="['numeroOrden', 'proveedor.nombre', 'fechaOrdenCompra', 'estado']"
    [(selection)]="selectedOrdenes"
    (shouldonCreate)="openNew()"
    (shouldonEdit)="editOrden($event)"
    (shouldonDelete)="deleteOrden($event)"
    (shouldonDeleteSelected)="deleteSelectedOrdenes($event)"
></app-data-table>
