<div class="card p-2 m-0 shadow-lg bg-bg-card transition-colors duration-300">
  <div class="flex-none flex flex-col gap-1 mb-4 px-4 pt-4">
    <div class="flex items-center gap-2 text-primary">
      <i class="pi pi-shopping-cart text-xl"></i>
      <span class="text-xl font-semibold">Órdenes de Compra</span>
    </div>
    <span class="text-surface-500 dark:text-surface-400 text-sm">
      Gestión de compras a proveedores
    </span>
  </div>

  <p-confirmDialog />
  <app-data-table
    #dataTable
    [data]="ordenesCompra"
    [cols]="cols"
    [globalFilterFields]="['numeroOrden', 'proveedor.nombre', 'fechaOrdenCompra', 'estado']"
    [(selection)]="selectedOrdenes"
    (shouldonCreate)="openNew()"
    (shouldonEdit)="editOrden($event)"
    (shouldonDelete)="deleteOrden($event)"
    (shouldonDeleteSelected)="deleteSelectedOrdenes($event)"
  ></app-data-table>
</div>
