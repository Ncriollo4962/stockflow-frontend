<div class="relative min-h-screen flex items-center justify-center bg-surface-50 dark:bg-surface-950 p-4 transition-colors duration-300 bg-cover bg-center bg-no-repeat overflow-hidden" style="background-image: url('/assets/auth-bg.svg');">

  <div class="absolute inset-0 bg-gradient-to-b from-black/45 via-black/20 to-black/45 dark:from-black/70 dark:via-black/50 dark:to-black/70"></div>

  <div class="absolute top-4 right-4 z-20">
    <p-button
      (onClick)="toggleTheme()"
      [icon]="isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      styleClass="w-12 h-12 !bg-white/80 backdrop-blur-sm dark:!bg-surface-900 shadow-lg !text-surface-900 dark:!text-surface-0 hover:!bg-white dark:hover:!bg-surface-800 transition-all"
    ></p-button>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <div class="bg-white/80 dark:bg-surface-900 backdrop-blur-xl py-8 px-4 shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none rounded-2xl sm:px-10 border border-white/20 dark:border-surface-800 ring-1 ring-black/5 dark:ring-white/5">
      <router-outlet></router-outlet>
    </div>
  </div>
  <p-toast position="bottom-right" />
</div>
